spring.application.name=MBQ

# ==================================================
# PostgreSQL Database
# ==================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mbq}
spring.datasource.username=${DB_USERNAME:mbq_user}
spring.datasource.password=${DB_PASSWORD}

# ==================================================
# Hibernate / JPA
# Flyway manages schema changes.
# Hibernate validates mappings against the schema.
# ==================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==================================================
# Flyway Database Migrations
# ==================================================
spring.flyway.enabled=true

# ==================================================
# Server
# ==================================================
# 8081 matches the frontend dev proxy (Frontend/vite.config.js). Override with SERVER_PORT.
server.port=${PORT:${SERVER_PORT:8081}}

# Send the error reason to the frontend (e.g. "Patient not found")
# instead of only "Bad Request". Stack traces stay hidden.
server.error.include-message=always
server.error.include-binding-errors=always

# ==================================================
# JWT Authentication
# Supply JWT_SECRET through the environment.
# Never commit a real secret to Git.
# ==================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

# Comma-separated browser origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional XGBoost forecasting microservice. Blank URL keeps the Java baseline active.
app.blood-intelligence.ml-url=${BLOOD_INTELLIGENCE_ML_URL:}
app.blood-intelligence.ml-api-key=${BLOOD_INTELLIGENCE_ML_API_KEY:}
