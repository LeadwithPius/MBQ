spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:mbq_db}
    username: ${DB_USER:mbq_user}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}  # 32+ chars
    expiration-ms: 28800000
